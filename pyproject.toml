[project]
name = "agent-runtime"
description = "An owned API for iterative task planning, authorized tools, scoped subagents, verification and results."
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "tiktoken==0.14.0",
    "fastmcp-slim[server]==4.0.3",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pydantic-ai-slim[anthropic,mcp,openai,temporal]==2.43.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: local PostgreSQL and Temporal required", "live: explicit paid provider smoke"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
