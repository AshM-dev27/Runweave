services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: agents
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents"]
      interval: 2s
      timeout: 3s
      retries: 30
  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: agents
      POSTGRES_PWD: local-development-only
      POSTGRES_SEEDS: postgres
    ports: ["127.0.0.1:7233:7233"]
  mcp:
    build: .
    command: ["uv", "run", "--frozen", "--no-dev", "python", "-m", "agent_runtime.mcp_server"]
    ports: ["127.0.0.1:8001:8001"]
  migrate:
    build: .
    profiles: [app]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+asyncpg://agents:local-development-only@postgres:5432/agents
    command: ["uv", "run", "--frozen", "--no-dev", "alembic", "upgrade", "head"]
  api:
    build: .
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    profiles: [app]
    depends_on:
      migrate: {condition: service_completed_successfully}
    env_file: .env.api.local
    environment:
      DATABASE_URL: postgresql+asyncpg://agents:local-development-only@postgres:5432/agents
      TEMPORAL_ADDRESS: temporal:7233
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      E2B_API_KEY: ""
      ARTIFACT_STORAGE_PATH: /var/lib/runweave/artifacts
    volumes: ["artifact-data:/var/lib/runweave/artifacts"]
    command: ["uv", "run", "--frozen", "--no-dev", "uvicorn", "agent_runtime.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
  worker:
    build: .
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    profiles: [app]
    depends_on:
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_started}
      mcp: {condition: service_started}
    env_file:
      - path: "${AGENTS_ENV_FILE:-.env.local}"
      - path: .env.sandbox.local
      - path: .env.e2b.local
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://agents:local-development-only@postgres:5432/agents
      TEMPORAL_ADDRESS: temporal:7233
      MCP_URL: http://mcp:8001/mcp
      SANDBOX_BROKER_URL: http://sandbox-broker:8090
      API_KEY: ""
      ARTIFACT_STORAGE_PATH: /var/lib/runweave/artifacts
    volumes: ["artifact-data:/var/lib/runweave/artifacts"]
    command: ["uv", "run", "--frozen", "--no-dev", "python", "-m", "agent_runtime.worker"]
  sandbox-image:
    image: agent-runtime-sandbox:v1
    build:
      context: .
      dockerfile: sandbox/Dockerfile.job
    profiles: [sandbox-build]
  sandbox-broker:
    build:
      context: .
      dockerfile: sandbox/Dockerfile.broker
    profiles: [app]
    env_file: .env.sandbox.local
    ports: ["127.0.0.1:18090:8090"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox-state:/state
    restart: unless-stopped
volumes:
  sandbox-state:
  postgres-data:
  artifact-data:
