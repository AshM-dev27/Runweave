<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1210" viewBox="0 0 1600 1210" role="img" aria-labelledby="title desc">
<title id="title">Runweave architecture</title>
<desc id="desc">Clients submit tasks to FastAPI. PostgreSQL holds durable application state and a transactional outbox. The worker dispatcher delivers work to Temporal; deterministic workflows schedule activities. Activities perform all model and tool I/O through private adapters. API and activities share persistent artifact byte storage. External execution includes model providers, MCP and hosted browser services, trusted Docker project jobs, and disposable or reusable E2B computers. Guest files are temporary; published artifacts are durable.</desc>
