name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_PROJECT_BROKER_NAME: runweave-test-sandbox-broker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.12'
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Build isolated execution images
        run: |
          docker compose -f compose.test.yaml build sandbox-image
          uv run python -m scripts.prepare_project_image --update-policy --tag runweave-test-project:local
      - name: Start disposable test services
        run: docker compose -f compose.test.yaml up -d --build --wait postgres temporal mcp sandbox-broker
      - name: Wait for PostgreSQL, Temporal and MCP
        run: uv run python -m scripts.wait_services
      - run: uv run alembic upgrade head
      - name: Run service and recovery tests with fake models
        run: uv run pytest -q --integration -m integration
      - if: always()
        run: docker compose -f compose.test.yaml down -v --remove-orphans
